# The logic lives in ci/check and ci/package; this file picks the runner and the Pythons, and calls them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs these first

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # the oldest pp supports, and the newest. The floor is pinned to its patch: "3.11" is the newest 3.11.
        python: ["3.11.4", "3.14"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.21"
          enable-cache: false
      - name: zsh, for the tests that skip without it
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh
      - run: ci/check ${{ matrix.python }}

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.21"
          enable-cache: false
      - run: ci/package 3.11
